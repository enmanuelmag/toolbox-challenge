services:
  api:
    container_name: toolbox-challenge-api
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    expose:
      - '3000'

  web:
    container_name: toolbox-challenge-web
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - api
